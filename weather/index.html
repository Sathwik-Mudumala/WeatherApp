<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>WeatherNow - Real-time Weather</title>
</head>
<body>
  <div class="container">
    <!-- Header with search -->
    <header>
      <div class="logo">
        <i class="fas fa-cloud-sun"></i>
        <h1>WeatherNow</h1>
      </div>
      <div class="search-bar">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search city..." 
          autocomplete="off"
        />
        <button id="search-btn">
          <i class="fas fa-search"></i>
        </button>
        <button id="location-btn" title="Use current location">
          <i class="fas fa-location-crosshairs"></i>
        </button>
      </div>
    </header>

    <!-- Loading state -->
    <div id="loading" class="loading hidden">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading weather data...</p>
    </div>

    <!-- Error message -->
    <div id="error" class="error hidden">
      <i class="fas fa-exclamation-circle"></i>
      <p id="error-message">Something went wrong</p>
    </div>

    <!-- Weather display -->
    <main id="weather-display" class="weather-display hidden">
      <!-- Current weather -->
      <div class="current-weather">
        <div class="location-info">
          <h2 id="city-name">Loading...</h2>
          <p id="date-time"></p>
        </div>

        <div class="weather-main">
          <img id="weather-icon" src="img/sun.png" alt="Weather icon" />
          <div class="temperature">
            <span id="temp">--</span>
            <span class="unit">°C</span>
          </div>
          <p id="weather-description">Clear Sky</p>
        </div>

        <!-- Weather details grid -->
        <div class="weather-details">
          <div class="detail-card">
            <i class="fas fa-temperature-high"></i>
            <div>
              <p class="detail-label">Feels Like</p>
              <p class="detail-value" id="feels-like">--°C</p>
            </div>
          </div>

          <div class="detail-card">
            <i class="fas fa-droplet"></i>
            <div>
              <p class="detail-label">Humidity</p>
              <p class="detail-value" id="humidity">--%</p>
            </div>
          </div>

          <div class="detail-card">
            <i class="fas fa-wind"></i>
            <div>
              <p class="detail-label">Wind Speed</p>
              <p class="detail-value" id="wind-speed">-- m/s</p>
            </div>
          </div>

          <div class="detail-card">
            <i class="fas fa-gauge"></i>
            <div>
              <p class="detail-label">Pressure</p>
              <p class="detail-value" id="pressure">-- hPa</p>
            </div>
          </div>

          <div class="detail-card">
            <i class="fas fa-eye"></i>
            <div>
              <p class="detail-label">Visibility</p>
              <p class="detail-value" id="visibility">-- km</p>
            </div>
          </div>

          <div class="detail-card">
            <i class="fas fa-cloud"></i>
            <div>
              <p class="detail-label">Cloudiness</p>
              <p class="detail-value" id="cloudiness">--%</p>
            </div>
          </div>
        </div>

        <!-- Sun times -->
        <div class="sun-times">
          <div class="sun-time">
            <i class="fas fa-sunrise"></i>
            <div>
              <p class="sun-label">Sunrise</p>
              <p class="sun-value" id="sunrise">--:--</p>
            </div>
          </div>
          <div class="sun-time">
            <i class="fas fa-sunset"></i>
            <div>
              <p class="sun-label">Sunset</p>
              <p class="sun-value" id="sunset">--:--</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>Powered by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
